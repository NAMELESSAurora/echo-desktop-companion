[project]
name = "desktop-companion-backend"
version = "0.1.0"
description = "Local, provider-independent conversation, vision, memory and speech pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14,<17",
  "httpx>=0.28,<1",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.6,<3",
]

[project.scripts]
echo-companion = "companion.desktop:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
desktop = ["pystray>=0.19.5,<1", "pillow>=11,<12", "pyinstaller>=6.11,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]
